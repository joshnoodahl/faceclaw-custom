name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-evenhub-file-picker
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install NativeScript CLI
        run: npm install --no-save nativescript@9.1.1

      - name: Verify NativeScript CLI
        run: |
          test -x node_modules/.bin/nativescript
          node_modules/.bin/nativescript --version

      # Every build signs with the same key (the ANDROID_DEBUG_KEYSTORE_BASE64
      # secret), so a new APK installs over the last one and keeps its data.
      # Without the secret the runner generates a throwaway key, as before.
      - name: Install persistent debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key and will not install over earlier builds."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "Using the persistent debug signing key."

      - name: Build debug APK
        env:
          NS_SKIP_ENV_CHECK: '1'
        run: npm run build

      - name: Show APK signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs platforms/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA-256'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: faceclaw-android-debug-${{ github.sha }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
